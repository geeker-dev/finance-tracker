# Еженедельный дамп базы (на бесплатном тарифе Supabase своих бэкапов нет).
# Нужен секрет SUPABASE_DB_URL — строка подключения (Project Settings → Database → Connection string, режим Session pooler).
# Дамп сохраняется как приватный артефакт workflow на 90 дней.
name: Weekly database backup
on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      - name: Dump public schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges -f backup-$(date +%F).sql
          ls -lh backup-*.sql
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup-*.sql
          retention-days: 90
